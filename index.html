<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE & LADDER - Dark Neon Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: #0f0f15; 
            color: #fff; 
            padding: 10px;
        }

        .title { 
            font-size: 2.2rem; 
            font-weight: 900;
            margin-bottom: 8px; 
            background: linear-gradient(135deg, #00F2FE, #4FACFE, #00C6FF);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 2px;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
            background: #1a1c23;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #2a2d3d;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .score-box { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; }
        .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
        .dot.player { background: #ffd700; box-shadow: 0 0 8px #ffd700; }
        .dot.ai { background: #ff007f; box-shadow: 0 0 8px #ff007f; }

        .tips-box {
            font-size: 0.9rem;
            margin-bottom: 12px;
            color: #ffd700;
            font-weight: 600;
            min-height: 38px;
            text-align: center;
            padding: 6px 14px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 360px;
            width: 100%;
        }

        /* 60 Tile Board Container */
        .board-container {
            position: relative;
            width: 360px;
            height: 600px; /* 6 cols x 10 rows (each 60px x 60px) */
            background: #1e2230;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 3px solid #3a3f58;
            overflow: hidden;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            grid-template-rows: repeat(10, 60px);
            width: 100%;
            height: 100%;
        }

        .tile {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 4px 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #8e95b0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tile.even { background-color: #232838; }
        .tile.odd { background-color: #1a1e2b; }
        
        /* Special Tiles based on image logic */
        .tile.start-tile { background-color: #b45309 !important; color: #fff; } /* Yellow Tile 1 */
        .tile.bin-tile { background-color: #1e3a8a !important; color: #38bdf8; } /* Blue Tile */
        .tile.dice-tile { background-color: #881337 !important; color: #fda4af; } /* Red Tile */
        .tile.win-tile { background-color: #065f46 !important; color: #34d399; }

        .tile-icon {
            position: absolute;
            bottom: 3px;
            right: 4px;
            font-size: 1.1rem;
        }

        /* Overlay SVG for Vector Snakes & Golden Ladders */
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Player Tokens */
        .piece {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
            border: 2px solid #fff;
        }
        .piece.player { background: radial-gradient(circle, #ffd700, #b8860b); color: #000; }
        .piece.ai { background: radial-gradient(circle, #ff007f, #8b0042); color: #fff; }

        /* Controls & Dice */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .dice-3d {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 14px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.8);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 8px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .dice-3d:active { transform: scale(0.92); }
        .dice-3d.rolling { animation: spin 0.5s ease-in-out infinite; }

        .pip {
            background-color: #111;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            margin: auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .btn-reset {
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            background: #2a2d3d;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: #3a3f54; color: #fff; }
    </style>
</head>
<body>

    <h1 class="title">SNAKE & LADDER</h1>

    <div class="scoreboard">
        <div class="score-box"><span class="dot player"></span> ඔබ: <span id="playerPosText">1</span></div>
        <div class="score-box"><span class="dot ai"></span> Notiya: <span id="aiPosText">1</span></div>
    </div>

    <div class="tips-box" id="tipsText">🎲 දාදු කැටය Touch කර ක්‍රීඩාව ආරම්භ කරන්න!</div>

    <div class="board-container">
        <div class="board-grid" id="boardGrid"></div>
        <svg class="svg-overlay" id="svgOverlay"></svg>
        
        <!-- Player Tokens -->
        <div class="piece player" id="playerPiece">🟡</div>
        <div class="piece ai" id="aiPiece">🤖</div>
    </div>

    <div class="controls">
        <div class="dice-3d" id="diceElem" onclick="handlePlayerRoll()">
            <div class="pip" id="p1"></div><div class="pip" id="p2"></div><div class="pip" id="p3"></div>
            <div class="pip" id="p4"></div><div class="pip" id="p5"></div><div class="pip" id="p6"></div>
            <div class="pip" id="p7"></div><div class="pip" id="p8"></div><div class="pip" id="p9"></div>
        </div>
        <button class="btn-reset" onclick="resetGame()">නැවත පටන්ගන්න</button>
    </div>

    <script>
        const COLS = 6;
        const ROWS = 10;
        const TOTAL_TILES = 60;

        // Ladders, Snakes, Bins & Extra Turn Tiles
        const LADDERS = { 5: 18, 12: 28, 22: 39, 34: 54, 41: 57 };
        const SNAKES = { 24: 8, 37: 15, 46: 25, 53: 31, 58: 38 };
        const BINS = [19, 44];
        const EXTRA_DICE = [14, 48];

        let playerPos = 1;
        let aiPos = 1;
        let isPlayerTurn = true;
        let isBusy = false;
        let playerSkipTurn = false;
        let aiSkipTurn = false;

        const pipLayouts = {
            1: [5],
            2: [3, 7],
            3: [3, 5, 7],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9]
        };

        function showDiceValue(val) {
            for (let i = 1; i <= 9; i++) {
                document.getElementById(`p${i}`).style.display = "none";
            }
            if (pipLayouts[val]) {
                pipLayouts[val].forEach(id => {
                    document.getElementById(`p${id}`).style.display = "block";
                });
            }
        }

        function getTileCoords(tileNum) {
            let zeroBased = tileNum - 1;
            let rowFromBottom = Math.floor(zeroBased / COLS);
            let col = zeroBased % COLS;

            if (rowFromBottom % 2 === 1) {
                col = (COLS - 1) - col;
            }

            let gridRow = (ROWS - 1) - rowFromBottom;
            return { row: gridRow, col: col };
        }

        function getTileCenterPixel(tileNum) {
            let { row, col } = getTileCoords(tileNum);
            let tileWidth = 360 / COLS;
            let tileHeight = 600 / ROWS;

            return {
                x: col * tileWidth + tileWidth / 2,
                y: row * tileHeight + tileHeight / 2
            };
        }

        function createBoard() {
            const gridElem = document.getElementById("boardGrid");
            gridElem.innerHTML = "";

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let rowFromBottom = (ROWS - 1) - r;
                    let colIndex = (rowFromBottom % 2 === 1) ? (COLS - 1 - c) : c;
                    let tileNum = rowFromBottom * COLS + colIndex + 1;

                    const tile = document.createElement("div");
                    tile.classList.add("tile", tileNum % 2 === 0 ? "even" : "odd");

                    if (tileNum === 1) tile.classList.add("start-tile");
                    else if (BINS.includes(tileNum)) tile.classList.add("bin-tile");
                    else if (EXTRA_DICE.includes(tileNum)) tile.classList.add("dice-tile");
                    else if (tileNum === 60) tile.classList.add("win-tile");

                    tile.innerText = tileNum;

                    // Icons
                    const iconSpan = document.createElement("span");
                    iconSpan.classList.add("tile-icon");
                    if (BINS.includes(tileNum)) iconSpan.innerText = "🗑️";
                    else if (EXTRA_DICE.includes(tileNum)) iconSpan.innerText = "🎲";
                    else if (tileNum === 60) iconSpan.innerText = "🏆";

                    tile.appendChild(iconSpan);
                    gridElem.appendChild(tile);
                }
            }
            drawGraphics();
            updatePiecePositions();
            showDiceValue(5);
        }

        function drawGraphics() {
            const svg = document.getElementById("svgOverlay");
            svg.innerHTML = "";

            // Golden Ladders
            for (let start in LADDERS) {
                let p1 = getTileCenterPixel(parseInt(start));
                let p2 = getTileCenterPixel(LADDERS[start]);

                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let angle = Math.atan2(dy, dx);
                let pAngle = angle + Math.PI / 2;

                let offset = 9;
                let rx1 = p1.x + offset * Math.cos(pAngle), ry1 = p1.y + offset * Math.sin(pAngle);
                let rx2 = p2.x + offset * Math.cos(pAngle), ry2 = p2.y + offset * Math.sin(pAngle);
                let lx1 = p1.x - offset * Math.cos(pAngle), ly1 = p1.y - offset * Math.sin(pAngle);
                let lx2 = p2.x - offset * Math.cos(pAngle), ly2 = p2.y - offset * Math.sin(pAngle);

                // Side Rails
                [ [rx1, ry1, rx2, ry2], [lx1, ly1, lx2, ly2] ].forEach(([x1,y1,x2,y2]) => {
                    let rail = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    rail.setAttribute("x1", x1); rail.setAttribute("y1", y1);
                    rail.setAttribute("x2", x2); rail.setAttribute("y2", y2);
                    rail.setAttribute("stroke", "#ffd700");
                    rail.setAttribute("stroke-width", "4");
                    rail.setAttribute("stroke-linecap", "round");
                    svg.appendChild(rail);
                });

                // Rungs
                let steps = 5;
                for (let i = 1; i < steps; i++) {
                    let t = i / steps;
                    let rungX1 = lx1 + t * (lx2 - lx1);
                    let rungY1 = ly1 + t * (ly2 - ly1);
                    let rungX2 = rx1 + t * (rx2 - rx1);
                    let rungY2 = ry1 + t * (ry2 - ry1);

                    let rung = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    rung.setAttribute("x1", rungX1); rung.setAttribute("y1", rungY1);
                    rung.setAttribute("x2", rungX2); rung.setAttribute("y2", rungY2);
                    rung.setAttribute("stroke", "#f59e0b");
                    rung.setAttribute("stroke-width", "3");
                    svg.appendChild(rung);
                }
            }

            // Green Snakes
            for (let start in SNAKES) {
                let head = getTileCenterPixel(parseInt(start));
                let tail = getTileCenterPixel(SNAKES[start]);

                let midX = (head.x + tail.x) / 2 + (head.x > tail.x ? 25 : -25);
                let midY = (head.y + tail.y) / 2;

                // Snake Body
                let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                let d = `M ${head.x} ${head.y} Q ${midX} ${midY} ${tail.x} ${tail.y}`;
                path.setAttribute("d", d);
                path.setAttribute("stroke", "#10b981");
                path.setAttribute("stroke-width", "10");
                path.setAttribute("fill", "none");
                path.setAttribute("stroke-linecap", "round");
                svg.appendChild(path);

                // Snake Head
                let headElem = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                headElem.setAttribute("cx", head.x);
                headElem.setAttribute("cy", head.y);
                headElem.setAttribute("r", "8");
                headElem.setAttribute("fill", "#047857");
                svg.appendChild(headElem);

                // Snake Eye
                let eye = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                eye.setAttribute("cx", head.x - 2);
                eye.setAttribute("cy", head.y - 2);
                eye.setAttribute("r", "2");
                eye.setAttribute("fill", "#ffffff");
                svg.appendChild(eye);
            }
        }

        function updatePiecePositions() {
            let p1 = getTileCenterPixel(playerPos);
            let p2 = getTileCenterPixel(aiPos);

            const pPiece = document.getElementById("playerPiece");
            const aPiece = document.getElementById("aiPiece");

            let sameTile = playerPos === aiPos;
            pPiece.style.left = `${p1.x - 13 - (sameTile ? 7 : 0)}px`;
            pPiece.style.top = `${p1.y - 13}px`;

            aPiece.style.left = `${p2.x - 13 + (sameTile ? 7 : 0)}px`;
            aPiece.style.top = `${p2.y - 13}px`;

            document.getElementById("playerPosText").innerText = playerPos;
            document.getElementById("aiPosText").innerText = aiPos;
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        async function rollDiceAnimation() {
            const diceElem = document.getElementById("diceElem");
            diceElem.classList.add("rolling");
            
            let rollVal = 1;
            for (let i = 0; i < 6; i++) {
                rollVal = Math.floor(Math.random() * 6) + 1;
                showDiceValue(rollVal);
                await sleep(70);
            }

            diceElem.classList.remove("rolling");
            return rollVal;
        }

        async function handlePlayerRoll() {
            if (!isPlayerTurn || isBusy) return;
            isBusy = true;

            if (playerSkipTurn) {
                playerSkipTurn = false;
                setTip("🗑️ පසුගිය වාරයේ Bin එකට වැටුණු නිසා ඔබේ වාරය අහිමි විය!");
                await sleep(1400);
                isPlayerTurn = false;
                isBusy = false;
                aiTurn();
                return;
            }

            setTip("🎲 දාදු කැටය කැරකෙමින් පවතී...");
            let roll = await rollDiceAnimation();

            setTip(`ඔබට ${roll} ක් වැටුණා!`);
            await sleep(300);

            let won = await movePlayerStepByStep('player', roll);
            if (won) return;

            if (roll === 6) {
                setTip("🎲 6 වැටුණා! ඔබට තවත් වාරයක් හිමිවේ!");
                isBusy = false;
                return;
            }

            isPlayerTurn = false;
            isBusy = false;
            setTimeout(aiTurn, 1200);
        }

        async function aiTurn() {
            if (isPlayerTurn || isBusy) return;
            isBusy = true;

            if (aiSkipTurn) {
                aiSkipTurn = false;
                setTip("🤖 Notiya ගේ වාරය Bin එක නිසා අහිමි විය!");
                await sleep(1400);
                isPlayerTurn = true;
                isBusy = false;
                setTip("ඔබේ වාරය! දාදු කැටය Touch කරන්න.");
                return;
            }

            setTip("🤖 Notiya සිතමින් දාදු කැටය කරකවයි...");
            await sleep(1000);

            let roll = await rollDiceAnimation();
            setTip(`Notiya ට ${roll} ක් වැටුණා!`);
            await sleep(300);

            let won = await movePlayerStepByStep('ai', roll);
            if (won) return;

            if (roll === 6) {
                setTip("🎲 Notiya ට 6 වැටුණා! Notiya ට නැවත වාරයක් හිමිවේ!");
                isBusy = false;
                setTimeout(aiTurn, 1200);
                return;
            }

            isPlayerTurn = true;
            isBusy = false;
            setTip("ඔබේ වාරය! දාදු කැටය Touch කරන්න.");
        }

        async function movePlayerStepByStep(who, steps) {
            let current = (who === 'player') ? playerPos : aiPos;

            for (let i = 0; i < steps; i++) {
                if (current + 1 > TOTAL_TILES) break;
                current++;

                if (who === 'player') playerPos = current;
                else aiPos = current;

                updatePiecePositions();
                await sleep(200);
            }

            if (current === TOTAL_TILES) {
                if (who === 'player') {
                    setTip("🏆 සුබ පැතුම්! ඔබ තරඟය ජයග්‍රහණය කළා! 🎉");
                } else {
                    setTip("🤖 Notiya ජයග්‍රහණය කළා! නැවත උත්සාහ කරන්න.");
                }
                isBusy = true;
                return true;
            }

            // Check Ladder
            if (LADDERS[current]) {
                await sleep(250);
                setTip(who === 'player' ? "🪜 නියමයි! ඉනිමඟෙන් උඩට නැඟුණා!" : "🪜 Notiya ඉනිමඟෙන් උඩට නැඟුණා!");
                current = LADDERS[current];
                if (who === 'player') playerPos = current;
                else aiPos = current;
                updatePiecePositions();
                await sleep(400);
            }
            // Check Snake
            else if (SNAKES[current]) {
                await sleep(250);
                setTip(who === 'player' ? "🐍 අපොයි! නයාට අසුවී පහළට වැටුණා!" : "🐍 Notiya නයාට අසුවී පහළට වැටුණා!");
                current = SNAKES[current];
                if (who === 'player') playerPos = current;
                else aiPos = current;
                updatePiecePositions();
                await sleep(400);
            }
            // Check Bin
            else if (BINS.includes(current)) {
                await sleep(250);
                setTip(who === 'player' ? "🗑️ Bin එකට වැටුණා! ඔබේ මීළඟ වාරය අහිමි වේ." : "🗑️ Notiya Bin එකට වැටුණා! Notiya ගේ මීළඟ වාරය අහිමි වේ.");
                if (who === 'player') playerSkipTurn = true;
                else aiSkipTurn = true;
                await sleep(400);
            }
            // Check Extra Dice Tile
            else if (EXTRA_DICE.includes(current)) {
                await sleep(250);
                setTip(who === 'player' ? "🎲 Dice කොටුවට ආවා! ඔබට තවත් අමතර වාරයක් හිමිවේ!" : "🎲 Notiya Dice කොටුවට ආවා! Notiya ට අමතර වාරයක් හිමිවේ!");
                await sleep(500);
                if (who === 'player') {
                    isBusy = false;
                    return true; // Keep player turn
                } else {
                    isBusy = false;
                    setTimeout(aiTurn, 1200);
                    return true;
                }
            }

            return false;
        }

        function setTip(msg) {
            document.getElementById("tipsText").innerText = msg;
        }

        function resetGame() {
            playerPos = 1;
            aiPos = 1;
            isPlayerTurn = true;
            isBusy = false;
            playerSkipTurn = false;
            aiSkipTurn = false;
            setTip("🎲 දාදු කැටය Touch කර ක්‍රීඩාව ආරම්භ කරන්න!");
            updatePiecePositions();
            showDiceValue(5);
        }

        window.addEventListener('resize', drawGraphics);
        createBoard();
