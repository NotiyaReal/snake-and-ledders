<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE & LADDER - Notiya AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: #0f0f15; 
            color: #fff; 
            padding: 10px;
        }
        .title { 
            font-size: 2.2rem; 
            font-weight: 900;
            margin-bottom: 8px; 
            background: linear-gradient(135deg, #00F2FE, #4FACFE, #00C6FF);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 2px;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            background: #1a1c23;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid #2a2d3d;
            text-align: center;
        }
        .score-box { padding: 0 10px; }
        .score-box .label { font-size: 0.75rem; color: #8e95b0; margin-bottom: 2px; }
        .score-box .val { font-size: 1.1rem; font-weight: bold; color: #f5f5f7; }

        .tips-box {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #ffd700;
            font-weight: 600;
            min-height: 38px;
            text-align: center;
            padding: 6px 14px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 380px;
            width: 100%;
        }

        /* 60 Tile Board Container */
        .board-container {
            position: relative;
            width: 360px;
            height: 540px; /* 6 cols x 10 rows (each 60px) */
            background: #1e2230;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 3px solid #3a3f58;
            overflow: hidden;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            grid-template-rows: repeat(10, 54px);
            width: 100%;
            height: 100%;
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 3px 5px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #a0a5ba;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tile.even { background-color: #232838; }
        .tile.odd { background-color: #1a1e2b; }
        .tile.bin-tile { background-color: #3b2228 !important; }
        .tile.win-tile { background-color: #1b3a2b !important; color: #00ffcc; }

        .tile-icon {
            position: absolute;
            bottom: 3px;
            right: 4px;
            font-size: 1.1rem;
            opacity: 0.85;
        }

        /* Overlay SVG for Snakes and Ladders Connections */
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Player Tokens */
        .piece {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
        }
        .piece.player {
            background: radial-gradient(circle, #ffd700, #b8860b);
            color: #000;
            border: 2px solid #fff;
        }
        .piece.ai {
            background: radial-gradient(circle, #ff007f, #8b0042);
            color: #fff;
            border: 2px solid #fff;
        }

        /* Interactive Controls & Dice */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .dice {
            width: 58px;
            height: 58px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            color: #111;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.8);
            user-select: none;
            transition: transform 0.15s;
        }
        .dice:active { transform: scale(0.92); }
        .dice.rolling {
            animation: spin 0.6s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .btn-reset {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            background: #2a2d3d;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: #3a3f54; color: #fff; }
    </style>
</head>
<body>

    <h1 class="title">SNAKE & LADDER</h1>

    <div class="scoreboard">
        <div class="score-box"><div class="label">ඔබ (Gold)</div><div class="val" id="playerPosText">කොටුව: 1</div></div>
        <div class="score-box"><div class="label">Notiya (Pink)</div><div class="val" id="aiPosText">කොටුව: 1</div></div>
    </div>

    <div class="tips-box" id="tipsText">🎲 දාදු කැටය Touch කර ක්‍රීඩාව ආරම්භ කරන්න!</div>

    <div class="board-container">
        <div class="board-grid" id="boardGrid"></div>
        <svg class="svg-overlay" id="svgOverlay"></svg>
        
        <!-- Player & AI Tokens -->
        <div class="piece player" id="playerPiece">🟡</div>
        <div class="piece ai" id="aiPiece">🤖</div>
    </div>

    <div class="controls">
        <div class="dice-container" onclick="handlePlayerRoll()">
            <div class="dice" id="diceElem">🎲</div>
        </div>
        <button class="btn-reset" onclick="resetGame()">නැවත පටන්ගන්න</button>
    </div>

    <script>
        const COLS = 6;
        const ROWS = 10;
        const TOTAL_TILES = 60;

        // Snakes, Ladders, and Bins map
        const LADDERS = { 5: 18, 12: 28, 22: 39, 34: 54, 41: 57 };
        const SNAKES = { 24: 8, 37: 15, 46: 25, 53: 31, 58: 38 };
        const BINS = [19, 44];

        let playerPos = 1;
        let aiPos = 1;
        let isPlayerTurn = true;
        let isBusy = false;
        let playerSkipTurn = false;
        let aiSkipTurn = false;

        // Tile Coordinate calculations (Zigzag pattern)
        function getTileCoords(tileNum) {
            let zeroBased = tileNum - 1;
            let rowFromBottom = Math.floor(zeroBased / COLS);
            let col = zeroBased % COLS;

            if (rowFromBottom % 2 === 1) {
                col = (COLS - 1) - col; // Reverse column on odd rows
            }

            let gridRow = (ROWS - 1) - rowFromBottom; // Convert to top-down grid row
            return { row: gridRow, col: col };
        }

        function getTileCenterPixel(tileNum) {
            let { row, col } = getTileCoords(tileNum);
            let tileWidth = 360 / COLS;
            let tileHeight = 540 / ROWS;

            return {
                x: col * tileWidth + tileWidth / 2,
                y: row * tileHeight + tileHeight / 2
            };
        }

        function createBoard() {
            const gridElem = document.getElementById("boardGrid");
            gridElem.innerHTML = "";

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let rowFromBottom = (ROWS - 1) - r;
                    let colIndex = (rowFromBottom % 2 === 1) ? (COLS - 1 - c) : c;
                    let tileNum = rowFromBottom * COLS + colIndex + 1;

                    const tile = document.createElement("div");
                    tile.classList.add("tile", tileNum % 2 === 0 ? "even" : "odd");
                    if (BINS.includes(tileNum)) tile.classList.add("bin-tile");
                    if (tileNum === 60) tile.classList.add("win-tile");

                    tile.innerText = tileNum;

                    // Icons on board
                    const iconSpan = document.createElement("span");
                    iconSpan.classList.add("tile-icon");
                    if (LADDERS[tileNum]) iconSpan.innerText = "🪜";
                    else if (SNAKES[tileNum]) iconSpan.innerText = "🐍";
                    else if (BINS.includes(tileNum)) iconSpan.innerText = "🗑️";
                    else if (tileNum === 60) iconSpan.innerText = "🏆";

                    tile.appendChild(iconSpan);
                    gridElem.appendChild(tile);
                }
            }
            drawConnections();
            updatePiecePositions();
        }

        function drawConnections() {
            const svg = document.getElementById("svgOverlay");
            svg.innerHTML = "";

            // Draw Ladders (Green Lines)
            for (let start in LADDERS) {
                let p1 = getTileCenterPixel(parseInt(start));
                let p2 = getTileCenterPixel(LADDERS[start]);
                
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y);
                line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
                line.setAttribute("stroke", "#00ffcc");
                line.setAttribute("stroke-width", "4");
                line.setAttribute("stroke-dasharray", "6,4");
                line.setAttribute("opacity", "0.85");
                svg.appendChild(line);
            }

            // Draw Snakes (Red Curves)
            for (let start in SNAKES) {
                let p1 = getTileCenterPixel(parseInt(start));
                let p2 = getTileCenterPixel(SNAKES[start]);

                let midX = (p1.x + p2.x) / 2 + 25;
                let midY = (p1.y + p2.y) / 2;

                let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                let d = `M ${p1.x} ${p1.y} Q ${midX} ${midY} ${p2.x} ${p2.y}`;
                path.setAttribute("d", d);
                path.setAttribute("stroke", "#ff3366");
                path.setAttribute("stroke-width", "4");
                path.setAttribute("fill", "none");
                path.setAttribute("opacity", "0.85");
                svg.appendChild(path);
            }
        }

        function updatePiecePositions() {
            let p1 = getTileCenterPixel(playerPos);
            let p2 = getTileCenterPixel(aiPos);

            const pPiece = document.getElementById("playerPiece");
            const aPiece = document.getElementById("aiPiece");

            // Offset tokens slightly if on the same tile
            let sameTile = playerPos === aiPos;
            pPiece.style.left = `${p1.x - 12 - (sameTile ? 8 : 0)}px`;
            pPiece.style.top = `${p1.y - 12}px`;

            aPiece.style.left = `${p2.x - 12 + (sameTile ? 8 : 0)}px`;
            aPiece.style.top = `${p2.y - 12}px`;

            document.getElementById("playerPosText").innerText = `කොටුව: ${playerPos}`;
            document.getElementById("aiPosText").innerText = `කොටුව: ${aiPos}`;
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        async function rollDiceAnimation() {
            const diceElem = document.getElementById("diceElem");
            diceElem.classList.add("rolling");
            const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
            
            for (let i = 0; i < 6; i++) {
                diceElem.innerText = faces[Math.floor(Math.random() * 6)];
                await sleep(80);
            }

            let rollVal = Math.floor(Math.random() * 6) + 1;
            diceElem.innerText = faces[rollVal - 1];
            diceElem.classList.remove("rolling");
            return rollVal;
        }

        async function handlePlayerRoll() {
            if (!isPlayerTurn || isBusy) return;
            isBusy = true;

            if (playerSkipTurn) {
                playerSkipTurn = false;
                setTip("🗑️ පසුගිය වාරයේ Bin එකට වැටුණු නිසා ඔබේ වාරය අහිමි විය!");
                await sleep(1400);
                isPlayerTurn = false;
                isBusy = false;
                aiTurn();
                return;
            }

            setTip("🎲 දාදු කැටය කැරකෙමින් පවතී...");
            let roll = await rollDiceAnimation();

            setTip(`ඔබට ${roll} ක් වැටුණා!`);
            await sleep(300);

            let won = await movePlayerStepByStep('player', roll);
            if (won) return;

            if (roll === 6) {
                setTip("🎲 6 වැටුණා! ඔබට තවත් වාරයක් හිමිවේ!");
                isBusy = false;
                return; // Extra turn for rolling 6
            }

            isPlayerTurn = false;
            isBusy = false;
            setTimeout(aiTurn, 1200); // AI speed controlled (1.2s delay)
        }

        async function aiTurn() {
            if (isPlayerTurn || isBusy) return;
            isBusy = true;

            if (aiSkipTurn) {
                aiSkipTurn = false;
                setTip("🤖 Notiya ගේ වාරය Bin එක නිසා අහිමි විය!");
                await sleep(1400);
                isPlayerTurn = true;
                isBusy = false;
                setTip("ඔබේ වාරය! දාදු කැටය Touch කරන්න.");
                return;
            }

            setTip("🤖 Notiya සිතමින් දාදු කැටය කරකවයි...");
            await sleep(1000);

            let roll = await rollDiceAnimation();
            setTip(`Notiya ට ${roll} ක් වැටුණා!`);
            await sleep(300);

            let won = await movePlayerStepByStep('ai', roll);
            if (won) return;

            if (roll === 6) {
                setTip("🎲 Notiya ට 6 වැටුණා! Notiya ට නැවත වාරයක් හිමිවේ!");
                isBusy = false;
                setTimeout(aiTurn, 1200); // Extra turn for AI
                return;
            }

            isPlayerTurn = true;
            isBusy = false;
            setTip("ඔබේ වාරය! දාදු කැටය Touch කරන්න.");
        }

        async function movePlayerStepByStep(who, steps) {
            let current = (who === 'player') ? playerPos : aiPos;

            // Target check (Exact roll not strictly required, but stopping at 60)
            for (let i = 0; i < steps; i++) {
                if (current + 1 > TOTAL_TILES) break;
                current++;

                if (who === 'player') playerPos = current;
                else aiPos = current;

                updatePiecePositions();
                await sleep(220); // Step movement animation
            }

            // Check Win
            if (current === TOTAL_TILES) {
                if (who === 'player') {
                    setTip("🏆 සුබ පැතුම්! ඔබ තරඟය ජයග්‍රහණය කළා! 🎉");
                } else {
                    setTip("🤖 Notiya ජයග්‍රහණය කළා! නැවත උත්සාහ කරන්න.");
                }
                isBusy = true;
                return true;
            }

            // Check Ladder
            if (LADDERS[current]) {
                await sleep(300);
                setTip(who === 'player' ? "🪜 නියමයි! ඉනිමඟෙන් උඩට නැඟුණා!" : "🪜 Notiya ඉනිමඟෙන් උඩට නැඟුණා!");
                current = LADDERS[current];
                if (who === 'player') playerPos = current;
                else aiPos = current;
                updatePiecePositions();
                await sleep(400);
            }
            // Check Snake
            else if (SNAKES[current]) {
                await sleep(300);
                setTip(who === 'player' ? "🐍 අපොයි! නයාට අසුවී පහළට වැටුණා!" : "🐍 Notiya නයාට අසුවී පහළට වැටුණා!");
                current = SNAKES[current];
                if (who === 'player') playerPos = current;
                else aiPos = current;
                updatePiecePositions();
                await sleep(400);
            }
            // Check Bin
            else if (BINS.includes(current)) {
                await sleep(300);
                setTip(who === 'player' ? "🗑️ Bin එකට වැටුණා! ඔබේ මීළඟ වාරය අහිමි වේ." : "🗑️ Notiya Bin එකට වැටුණා! Notiya ගේ මීළඟ වාරය අහිමි වේ.");
                if (who === 'player') playerSkipTurn = true;
                else aiSkipTurn = true;
                await sleep(500);
            }

            return false;
        }

        function setTip(msg) {
            document.getElementById("tipsText").innerText = msg;
        }

        function resetGame() {
            playerPos = 1;
            aiPos = 1;
            isPlayerTurn = true;
            isBusy = false;
            playerSkipTurn = false;
            aiSkipTurn = false;
            setTip("🎲 දාදු කැටය Touch කර ක්‍රීඩාව ආරම්භ කරන්න!");
            updatePiecePositions();
        }

        window.addEventListener('resize', drawConnections);
        createBoard();
    </script>
</body>
</html>
