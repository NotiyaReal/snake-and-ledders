<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE & LADDER - Realistic Dark Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html, body {
            height: 100%;
            max-height: 100vh;
            overflow: hidden;
            background: #0d0f17;
            color: #fff;
            touch-action: manipulation;
        }

        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 6px;
        }

        .title { 
            font-size: 1.4rem; 
            font-weight: 900;
            background: linear-gradient(135deg, #00F2FE, #4FACFE);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 1px;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            gap: 12px;
            background: #1a1c25;
            padding: 4px 14px;
            border-radius: 12px;
            border: 1px solid #2a2d3d;
            text-align: center;
        }
        .score-box { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.8rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.player { background: #ffd700; box-shadow: 0 0 6px #ffd700; }
        .dot.ai { background: #ff007f; box-shadow: 0 0 6px #ff007f; }

        .tips-box {
            font-size: 0.78rem;
            color: #ffd700;
            font-weight: 600;
            height: 28px;
            text-align: center;
            padding: 2px 10px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(340px, 94vw);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Responsive Fits Single Mobile Screen */
        .board-container {
            position: relative;
            width: min(340px, 92vw);
            height: min(450px, 58vh);
            background: #161925;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 2px solid #2e344d;
            overflow: hidden;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
        }

        .tile {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2px 4px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #6b7280;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .tile.even { background-color: #1a1e2d; }
        .tile.odd { background-color: #141724; }
        
        .tile.start-tile { background-color: #7c2d12 !important; color: #ffedd5; }
        .tile.bin-tile { background-color: #1e3a8a !important; color: #93c5fd; }
        .tile.dice-tile { background-color: #881337 !important; color: #fecdd3; }
        .tile.win-tile { background-color: #064e3b !important; color: #a7f3d0; }

        .tile-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 0.85rem;
        }

        /* SVG for Realistic Snakes & Ladders */
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Player Tokens */
        .piece {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.8);
            transition: all 0.22s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
            border: 1.5px solid #fff;
        }
        .piece.player { background: radial-gradient(circle, #ffd700, #b8860b); color: #000; }
        .piece.ai { background: radial-gradient(circle, #ff007f, #8b0042); color: #fff; }

        /* Controls & Realistic Dice Layout */
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 4px;
        }

        .dice-3d {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 12px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.9);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 6px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .dice-3d:active { transform: scale(0.9); }
        .dice-3d.rolling { animation: spin 0.4s ease-in-out infinite; }

        .pip {
            background-color: #1e1b18;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            margin: auto;
            display: none;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .btn-reset {
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #252836;
            color: #bbb;
            border: 1px solid #3d4257;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-reset:hover { background: #32364a; color: #fff; }
    </style>
</head>
<body>

    <h1 class="title">SNAKE & LADDER</h1>

    <div class="scoreboard">
        <div class="score-box"><span class="dot player"></span> ඔබ: <span id="playerPosText">1</span></div>
        <div class="score-box"><span class="dot ai"></span> Notiya: <span id="aiPosText">1</span></div>
    </div>

    <div class="tips-box" id="tipsText">🎲 දාදු කැටය Touch කර ක්‍රීඩාව ආරම්භ කරන්න!</div>

    <div class="board-container">
        <div class="board-grid" id="boardGrid"></div>
        <svg class="svg-overlay" id="svgOverlay">
            <defs>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
                </filter>
            </defs>
        </svg>
        
        <!-- Player Tokens -->
        <div class="piece player" id="playerPiece">🟡</div>
        <div class="piece ai" id="aiPiece">🤖</div>
    </div>

    <div class="controls">
        <div class="dice-3d" id="diceElem" onclick="handlePlayerRoll()">
            <div class="pip" id="p1"></div><div class="pip" id="p2"></div><div class="pip" id="p3"></div>
            <div class="pip" id="p4"></div><div class="pip" id="p5"></div><div class="pip" id="p6"></div>
            <div class="pip" id="p7"></div><div class="pip" id="p8"></div><div class="pip" id="p9"></div>
        </div>
        <button class="btn-reset" onclick="resetGame()">නැවත පටන්ගන්න</button>
    </div>

    <script>
        const COLS = 6;
        const ROWS = 10;
        const TOTAL_TILES = 60;

        const LADDERS = { 5: 18, 12: 28, 22: 39, 34: 54, 41: 57 };
        const SNAKES = { 24: 8, 37: 15, 46: 25, 53: 31, 58: 38 };
        const BINS = [19, 44];
        const EXTRA_DICE = [14, 48];

        let playerPos = 1;
        let aiPos = 1;
        let isPlayerTurn = true;
        let isBusy = false;
        let playerSkipTurn = false;
        let aiSkipTurn = false;

        // Standard Dice Layout Mapping
        const pipLayouts = {
            1: [5],
            2: [3, 7],
            3: [3, 5, 7],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9] // 2 columns of 3 dots
        };

        function showDiceValue(val) {
            for (let i = 1; i <= 9; i++) {
                document.getElementById(`p${i}`).style.display = "none";
            }
            if (pipLayouts[val]) {
                pipLayouts[val].forEach(id => {
                    document.getElementById(`p${id}`).style.display = "block";
                });
            }
        }

        function getTileCoords(tileNum) {
            let zeroBased = tileNum - 1;
            let rowFromBottom = Math.floor(zeroBased / COLS);
            let col = zeroBased % COLS;

            if (rowFromBottom % 2 === 1) {
                col = (COLS - 1) - col;
            }

            let gridRow = (ROWS - 1) - rowFromBottom;
            return { row: gridRow, col: col };
        }

        function getTileCenterPixel(tileNum) {
            let container = document.querySelector('.board-container');
            let w = container.clientWidth;
            let h = container.clientHeight;

            let { row, col } = getTileCoords(tileNum);
            let tileWidth = w / COLS;
            let tileHeight = h / ROWS;

            return {
                x: col * tileWidth + tileWidth / 2,
                y: row * tileHeight + tileHeight / 2
            };
        }

        function createBoard() {
            const gridElem = document.getElementById("boardGrid");
            gridElem.innerHTML = "";

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let rowFromBottom = (ROWS - 1) - r;
                    let colIndex = (rowFromBottom % 2 === 1) ? (COLS - 1 - c) : c;
                    let tileNum = rowFromBottom * COLS + colIndex + 1;

                    const tile = document.createElement("div");
                    tile.classList.add("tile", tileNum % 2 === 0 ? "even" : "odd");

                    if (tileNum === 1) tile.classList.add("start-tile");
                    else if (BINS.includes(tileNum)) tile.classList.add("bin-tile");
                    else if (EXTRA_DICE.includes(tileNum)) tile.classList.add("dice-tile");
                    else if (tileNum === 60) tile.classList.add("win-tile");

                    tile.innerText = tileNum;

                    const iconSpan = document.createElement("span");
                    iconSpan.classList.add("tile-icon");
                    if (BINS.includes(tileNum)) iconSpan.innerText = "🗑️";
                    else if (EXTRA_DICE.includes(tileNum)) iconSpan.innerText = "🎲";
                    else if (tileNum === 60) iconSpan.innerText = "🏆";

                    tile.appendChild(iconSpan);
                    gridElem.appendChild(tile);
                }
            }
            setTimeout(() => {
                drawGraphics();
                updatePiecePositions();
            }, 50);
            showDiceValue(5);
        }

        function drawGraphics() {
            const svg = document.getElementById("svgOverlay");
            // Preserve Defs
            const defsHtml = `<defs>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
                </filter>
            </defs>`;
            svg.innerHTML = defsHtml;

            // Draw 3D Wooden Ladders with Shadow
            for (let start in LADDERS) {
                let p1 = getTileCenterPixel(parseInt(start));
                let p2 = getTileCenterPixel(LADDERS[start]);

                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let angle = Math.atan2(dy, dx);
                let pAngle = angle + Math.PI / 2;

                let offset = 7;
                let rx1 = p1.x + offset * Math.cos(pAngle), ry1 = p1.y + offset * Math.sin(pAngle);
                let rx2 = p2.x + offset * Math.cos(pAngle), ry2 = p2.y + offset * Math.sin(pAngle);
                let lx1 = p1.x - offset * Math.cos(pAngle), ly1 = p1.y - offset * Math.sin(pAngle);
                let lx2 = p2.x - offset * Math.cos(pAngle), ly2 = p2.y - offset * Math.sin(pAngle);

                let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("filter", "url(#shadow)");

                // Side Rails (Thick Yellow Wood)
                [ [rx1, ry1, rx2, ry2], [lx1, ly1, lx2, ly2] ].forEach(([x1,y1,x2,y2]) => {
                    let rail = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    rail.setAttribute("x1", x1); rail.setAttribute("y1", y1);
                    rail.setAttribute("x2", x2); rail.setAttribute("y2", y2);
                    rail.setAttribute("stroke", "#eab308");
                    rail.setAttribute("stroke-width", "4");
                    rail.setAttribute("stroke-linecap", "round");
                    g.appendChild(rail);
                });

                // Rungs
                let steps = 6;
                for (let i = 1; i < steps; i++) {
                    let t = i / steps;
                    let rungX1 = lx1 + t * (lx2 - lx1);
                    let rungY1 = ly1 + t * (ly2 - ly1);
                    let rungX2 = rx1 + t * (rx2 - rx1);
                    let rungY2 = ry1 + t * (ry2 - ry1);

                    let rung = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    rung.setAttribute("x1", rungX1); rung.setAttribute("y1", rungY1);
                    rung.setAttribute("x2", rungX2); rung.setAttribute("y2", rungY2);
                    rung.setAttribute("stroke", "#fde047");
                    rung.setAttribute("stroke-width", "3");
                    g.appendChild(rung);
                }
                svg.appendChild(g);
            }

            // Draw Realistic Green Snakes with Curves, Head, Eyes & Tongue
            for (let start in SNAKES) {
                let head = getTileCenterPixel(parseInt(start));
                let tail = getTileCenterPixel(SNAKES[start]);

                let midX = (head.x + tail.x) / 2 + (head.x > tail.x ? 25 : -25);
                let midY = (head.y + tail.y) / 2;

                let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("filter", "url(#shadow)");

                // Outer Snake Body Curve
                let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                let d = `M ${head.x} ${head.y} Q ${midX} ${midY} ${tail.x} ${tail.y}`;
                path.setAttribute("d", d);
                path.setAttribute("stroke", "#22c55e");
                path.setAttribute("stroke-width", "9");
                path.setAttribute("fill", "none");
                path.setAttribute("stroke-linecap", "round");
                g.appendChild(path);

                // Inner Pattern Line
                let innerPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                innerPath.setAttribute("d", d);
                innerPath.setAttribute("stroke", "#86efac");
                innerPath.setAttribute("stroke-width", "3");
                innerPath.setAttribute("fill", "none");
                innerPath.setAttribute("stroke-dasharray", "4,4");
                g.appendChild(innerPath);

                // Snake Head
                let headCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                headCircle.setAttribute("cx", head.x);
                headCircle.setAttribute("cy", head.y);
                headCircle.setAttribute("r", "7");
                headCircle.setAttribute("fill", "#15803d");
                g.appendChild(headCircle);

                // Snake Eyes
                let eye1 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                eye1.setAttribute("cx", head.x - 2);
                eye1.setAttribute("cy", head.y - 2);
                eye1.setAttribute("r", "1.8");
                eye1.setAttribute("fill", "#fff");

                let pupil = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                pupil.setAttribute("cx", head.x - 2);
                pupil.setAttribute("cy", head.y - 2);
                pupil.setAttribute("r", "0.8");
                pupil.setAttribute("fill", "#000");

                g.appendChild(eye1);
                g.appendChild(pupil);

                // Red Forked Tongue
                let tongue = document.createElementNS("http://www.w3.org/2000/svg", "line");
                tongue.setAttribute("x1", head.x); tongue.setAttribute("y1", head.y);
                tongue.setAttribute("x2", head.x - 5); tongue.setAttribute("y2", head.y - 5);
                tongue.setAttribute("stroke", "#ef4444");
                tongue.setAttribute("stroke-width", "1.5");
                g.appendChild(tongue);

                svg.appendChild(g);
            }
        }

        function updatePiecePositions() {
            let p1 = getTileCenterPixel(playerPos);
            let p2 = getTileCenterPixel(aiPos);

            const pPiece = document.getElementById("playerPiece");
            const aPiece = document.getElementById("aiPiece");

            let sameTile = playerPos === aiPos;
            pPiece.style.left = `${p1.x - 10 - (sameTile ? 5 : 0)}px`;
            pPiece.style.top = `${p1.y - 10}px`;

            aPiece.style.left = `${p2.x - 10 + (sameTile ? 5 : 0)}px`;
            aPiece.style.top = `${p2.y - 10}px`;

            document.getElementById("playerPosText").innerText = playerPos;
            document.getElementById("aiPosText").innerText = aiPos;
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        async function rollDiceAnimation() {
            const diceElem = document.getElementById("diceElem");
            diceElem.classList.add("rolling");
            
            let rollVal = 1;
            for (let i = 0; i < 6; i++) {
                rollVal = Math.floor(Math.random() * 6) + 1;
                showDiceValue(rollVal);
                await sleep(60);
            }

            diceElem.classList.remove("rolling");
            return rollVal;
        }

        async function handlePlayerRoll() {
            if (!isPlayerTurn || isBusy) return;
            isBusy = true;

            if (playerSkipTurn) {
                playerSkipTurn = false;
                setTip("🗑️ Bin එක නිසා වාරය අහිමි විය!");
                await sleep(1300);
                isPlayerTurn = false;
                isBusy = false;
                aiTurn();
                return;
            }

            setTip("🎲 දාදු කැටය කැරකේ...");
            let roll = await rollDiceAnimation();

            setTip(`ඔබට ${roll} ක් වැටුණා!`);
            await sleep(250);

            let won = await movePlayerStepByStep('player', roll);
            if (won) return;

            if (roll === 6) {
                setTip("🎲 6 වැටුණා! තවත් වාරයක් හිමිවේ!");
                isBusy = false;
                return;
            }

            isPlayerTurn = false;
            isBusy = false;
            setTimeout(aiTurn, 1100);
        }

        async function aiTurn() {
            if (isPlayerTurn || isBusy) return;
            isBusy = true;

            if (aiSkipTurn) {
                aiSkipTurn = false;
                setTip("🤖 Notiya ගේ වාරය Bin එක නිසා අහිමි විය!");
                await sleep(1300);
                isPlayerTurn = true;
                isBusy = false;
                setTip("ඔබේ වාරය! දාදු කැටය Touch කරන්න.");
                return;
            }

            setTip("🤖 Notiya සිතමින් දාදු කැටය කරකවයි...");
            await sleep(900);

            let roll = await rollDiceAnimation();
            setTip(`Notiya ට ${roll} ක් වැටුණා!`);
            await sleep(250);

            let won = await movePlayerStepByStep('ai', roll);
            if (won) return;

            if (roll === 6) {
                setTip("🎲 Notiya ට 6 වැටුණා! අමතර වාරයක් හිමිවේ!");
                isBusy = false;
                setTimeout(aiTurn, 1100);
                return;
            }

            isPlayerTurn = true;
            isBusy = false;
            setTip("ඔබේ වාරය! දාදු කැටය Touch කරන්න.");
        }

        async function movePlayerStepByStep(who, steps) {
            let current = (who === 'player') ? playerPos : aiPos;

            for (let i = 0; i < steps; i++) {
                if (current + 1 > TOTAL_TILES) break;
                current++;

                if (who === 'player') playerPos = current;
                else aiPos = current;

                updatePiecePositions();
                await sleep(180);
            }

            if (current === TOTAL_TILES) {
                if (who === 'player') {
                    setTip("🏆 ජයග්‍රහණය කළා! 🎉");
                } else {
                    setTip("🤖 Notiya ජයග්‍රහණය කළා!");
                }
                isBusy = true;
                return true;
            }

            if (LADDERS[current]) {
                await sleep(200);
                setTip(who === 'player' ? "🪜 ඉනිමඟෙන් උඩට නැඟුණා!" : "🪜 Notiya උඩට නැඟුණා!");
                current = LADDERS[current];
                if (who === 'player') playerPos = current;
                else aiPos = current;
                updatePiecePositions();
                await sleep(350);
            }
            else if (SNAKES[current]) {
                await sleep(200);
                setTip(who === 'player' ? "🐍 නයාට අසුවී පහළට වැටුණා!" : "🐍 Notiya පහළට වැටුණා!");
                current = SNAKES[current];
                if (who === 'player') playerPos = current;
                else aiPos = current;
                updatePiecePositions();
                await sleep(350);
            }
            else if (BINS.includes(current)) {
                await sleep(200);
                setTip("🗑️ Bin එක නිසා මීළඟ වාරය අහිමි වේ.");
                if (who === 'player') playerSkipTurn = true;
                else aiSkipTurn = true;
                await sleep(350);
            }
            else if (EXTRA_DICE.includes(current)) {
                await sleep(200);
                setTip("🎲 Dice කොටුව නිසා අමතර වාරයක් හිමිවේ!");
                await sleep(450);
                if (who === 'player') {
                    isBusy = false;
                    return true;
                } else {
                    isBusy = false;
                    setTimeout(aiTurn, 1100);
                    return true;
                }
            }

            return false;
        }

        function setTip(msg) {
            document.getElementById("tipsText").innerText = msg;
        }

        function resetGame() {
            playerPos = 1;
            aiPos = 1;
            isPlayerTurn = true;
            isBusy = false;
            playerSkipTurn = false;
            aiSkipTurn = false;
            setTip("🎲 දාදු කැටය Touch කර ක්‍රීඩාව ආරම්භ කරන්න!");
            updatePiecePositions();
            showDiceValue(5);
        }

        window.addEventListener('resize', () => {
            drawGraphics();
            updatePiecePositions();
        });
        createBoard();
    </script>
</body>
</html>
